<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones Preparatoria en 2 Años</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f1f5f9; margin: 0; padding: 0; color: #0f172a; }
        .banner { background: linear-gradient(135deg, #0f172a, #2563eb); color: white; text-align: center; padding: 25px 15px; }
        .banner h1 { margin: 0 0 8px 0; font-size: 1.5rem; color: #38bdf8; }
        .banner p { margin: 0; font-size: 0.95rem; color: #cbd5e1; }
        .container { max-width: 480px; margin: -20px auto 30px auto; padding: 0 15px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 0.85rem; margin-bottom: 5px; color: #334155; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        input:focus, select:focus { outline: none; border-color: #2563eb; }
        .btn-submit { width: 100%; background-color: #2563eb; color: white; font-weight: bold; padding: 14px; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #1d4ed8; }
        .alert { display: none; padding: 12px; margin-top: 15px; border-radius: 6px; text-align: center; font-size: 0.9rem; font-weight: bold; }
        .alert-success { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
    </style>
</head>
<body>

    <div class="banner">
        <h1>🎓 Preparatoria en 2 Años</h1>
        <p>Estudia a tu ritmo | Validez Oficial</p>
    </div>

    <div class="container">
        <div class="card">
            <form id="registroForm">
                <div class="form-group">
                    <label>¿Quién solicita la información?</label>
                    <select id="tipoContacto" required>
                        <option value="" disabled selected>Selecciona una opción...</option>
                        <option value="Alumno Directo">👤 Soy el alumno interesado</option>
                        <option value="Padre / Tutor">👨‍👩‍👧 Busco informes para un familiar</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nombre Completo del Candidato (Alumno)</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Pérez López" required>
                </div>

                <div class="form-group">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" id="fechaNacimiento" required>
                </div>

                <div class="form-group">
                    <label>Lugar de Nacimiento</label>
                    <input type="text" id="lugarNacimiento" placeholder="Ej. Uruapan, Michoacán" required>
                </div>

                <div class="form-group">
                    <label>Modalidad de Interés</label>
                    <select id="modalidad" required>
                        <option value="" disabled selected>Selecciona la modalidad...</option>
                        <option value="Escolarizada">🏫 Escolarizada (Entre semana)</option>
                        <option value="Sabatina">📅 Sabatina (Fin de semana)</option>
                        <option value="Dominical">📅 Dominical (Fin de semana)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Teléfono / WhatsApp de Contacto (10 dígitos)</label>
                    <input type="tel" id="telefono" placeholder="Ej. 4521234567" pattern="[0-9]{10}" required>
                </div>

                <button type="submit" class="btn-submit" id="btnEnviar">Enviar Datos e Iniciar Proceso 🚀</button>
            </form>
            <div id="mensajeExito" class="alert alert-success">
                ¡Datos registrados con éxito! Un asesor educativo se comunicará contigo vía WhatsApp a la brevedad.
            </div>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT TERMINADA EN /exec
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzBXp9PE18J7PMCw3u4kwDO9Qboe_D0caiGKt3391jBDDojVujbCxSuweZGAoQ4S0Yu/exec";

        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;
            btn.innerText = "Enviando registros...";

            const payload = {
                tipoContacto: document.getElementById('tipoContacto').value,
                nombre: document.getElementById('nombre').value,
                fechaNacimiento: document.getElementById('fechaNacimiento').value,
                lugarNacimiento: document.getElementById('lugarNacimiento').value,
                modalidad: document.getElementById('modalidad').value,
                telefono: document.getElementById('telefono').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById('registroForm').reset();
                document.getElementById('mensajeExito').style.display = 'block';
                btn.innerText = "Enviar Datos e Iniciar Proceso 🚀";
                btn.disabled = false;
            })
            .catch(error => {
                alert("Hubo un detalle al enviar la información. Intenta de nuevo.");
                btn.disabled = false;
                btn.innerText = "Enviar Datos e Iniciar Proceso 🚀";
            });
        });
    </script>
</body>
</html>
